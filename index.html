<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>UNIONFLEX CALCULATOR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6e8a'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EUF%3C/text%3E%3C/svg%3E">
<style>
/* UNIONFLEX CALCULATOR — стили интерфейса */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e3e8ef;
  --border-strong: #cbd4e1;
  --text: #16202e;
  --text-2: #4b5768;
  --text-3: #7b8697;
  --accent: #0b6e8a;
  --accent-strong: #09576d;
  --accent-soft: #e3f2f6;
  --accent-text: #075066;
  --ok: #1a7f4e; --ok-soft: #e5f5ec;
  --warn: #8a5a00; --warn-soft: #fff4d9;
  --err: #b42318; --err-soft: #fdecea;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171e27; --surface-2: #1c2530; --border: #2a3542; --border-strong: #3a4757;
    --text: #e8edf3; --text-2: #b3bdc9; --text-3: #8894a3;
    --accent: #38b2d4; --accent-strong: #62c6e2; --accent-soft: #123845; --accent-text: #9fdcee;
    --ok: #4cc38a; --ok-soft: #13301f; --warn: #f0b429; --warn-soft: #33290f; --err: #ff7b72; --err-soft: #3a1714;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e27; --surface-2: #1c2530; --border: #2a3542; --border-strong: #3a4757;
  --text: #e8edf3; --text-2: #b3bdc9; --text-3: #8894a3;
  --accent: #38b2d4; --accent-strong: #62c6e2; --accent-soft: #123845; --accent-text: #9fdcee;
  --ok: #4cc38a; --ok-soft: #13301f; --warn: #f0b429; --warn-soft: #33290f; --err: #ff7b72; --err-soft: #3a1714;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- шапка ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-right: auto; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; letter-spacing: .5px; font-size: 13px; }
.brand-name { font-weight: 700; letter-spacing: .6px; font-size: 15px; }
.brand-name small { display: block; font-weight: 500; letter-spacing: .2px; color: var(--text-3); font-size: 11px; }
.theme-btn { min-height: 36px; padding: 0 10px; gap: 6px; font-size: 13px; color: var(--text-2); }
@media (max-width: 640px) { .theme-btn { width: 38px; padding: 0; } }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--border-strong); transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle input:checked + .switch { background: var(--accent); }
.toggle input:checked + .switch::after { transform: translateX(16px); }
.toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: var(--radius);
  border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.danger, .btn.ghost.danger { border-color: var(--err); color: var(--err); background: var(--err-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 96px; }

/* ---------- главная ---------- */
.hero { padding: 24px 0 8px; }
.hero h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.3px; }
.hero p { font-size: 18px; color: var(--text-2); margin: 0; max-width: 720px; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); margin: 32px 0 12px; font-weight: 600; }
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.goal { display: flex; gap: 14px; align-items: flex-start; text-align: left; padding: 18px; border-radius: var(--radius-lg); background: var(--surface);
  border: 1px solid var(--border); cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; width: 100%; }
.goal:hover { border-color: var(--accent); transform: translateY(-1px); }
.goal:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.goal-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.goal-ic .icon { width: 24px; height: 24px; }
.goal b { display: block; font-size: 16px; margin-bottom: 2px; }
.goal span { color: var(--text-2); font-size: 14px; }
.recent { display: grid; gap: 8px; }
.recent-item, .hist-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.recent-item { cursor: pointer; }
.recent-item:hover { border-color: var(--accent); }
.recent-item .big, .hist-item .big { font-weight: 700; font-size: 18px; margin-left: auto; white-space: nowrap; }
.muted { color: var(--text-3); font-size: 13px; }
.note-box { margin-top: 28px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; }

/* ---------- экран расчёта ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.calc-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.calc-head h1 { font-size: 26px; margin: 0; letter-spacing: -.2px; }
.calc-head p { margin: 2px 0 0; color: var(--text-2); }
.calc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.step { padding: 18px 20px 20px; margin-bottom: 16px; }
.step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.step-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.step-n.done { background: var(--ok); }
.step-h h2 { font-size: 17px; margin: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.help { position: relative; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong); color: var(--text-3);
  font-size: 11px; font-weight: 700; cursor: help; background: var(--surface); }
.help:focus-visible { outline: 2px solid var(--accent); }
.help .tip { display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: 260px; padding: 10px 12px; border-radius: 8px;
  background: var(--text); color: var(--surface); font-weight: 400; font-size: 12.5px; line-height: 1.45; z-index: 30; box-shadow: var(--shadow); }
.help:hover .tip, .help:focus .tip { display: block; }
.inp { display: flex; align-items: stretch; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); min-height: 44px; overflow: hidden; }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp input, .inp select { border: 0; outline: 0; background: transparent; padding: 0 12px; flex: 1; min-width: 0; font-size: 16px; }
.inp select { cursor: pointer; }
.inp .unit { display: grid; place-items: center; padding: 0 12px; color: var(--text-3); background: var(--surface-2); border-left: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
.field.invalid .inp { border-color: var(--err); }
.ferr { color: var(--err); font-size: 12.5px; }
.fhint { color: var(--text-3); font-size: 12.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 40px; padding: 6px 14px; max-width: 100%; text-align: left; line-height: 1.25; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 14px; }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent-text); }
.mats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mat { text-align: left; padding: 14px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; }
.mat[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
.mat b { display: block; font-size: 15px; }
.mat span { display: block; color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
.mat .props { color: var(--text-3); font-size: 12px; margin-top: 6px; }

/* ---------- результат ---------- */
.result { position: sticky; top: 76px; padding: 20px; }
.res-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); font-weight: 600; }
.res-big { font-size: 56px; font-weight: 800; line-height: 1.05; letter-spacing: -1px; margin: 6px 0 2px; color: var(--accent-text); }
.res-big small { font-size: 24px; font-weight: 700; }
.res-product { font-weight: 700; font-size: 16px; }
.res-sub { color: var(--text-2); font-size: 14px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 14px 0; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 14px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; font-weight: 700; text-align: right; }
.explain { font-size: 14px; color: var(--text); background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; }
.msg { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); font-size: 13.5px; margin: 8px 0; }
.msg .icon { width: 18px; height: 18px; margin-top: 1px; }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.err { background: var(--err-soft); color: var(--err); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.info { background: var(--accent-soft); color: var(--accent-text); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.actions .primary { grid-column: 1 / -1; }
.empty-res { color: var(--text-2); font-size: 14px; }
.empty-res ul { margin: 8px 0 0; padding-left: 18px; }
.parts { display: grid; gap: 10px; margin-top: 8px; }
.part { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.part .res-big { font-size: 36px; }

/* ---------- инженерный режим ---------- */
.eng { margin-top: 16px; padding: 18px 20px; }
.eng h3 { font-size: 15px; margin: 18px 0 8px; }
.eng h3:first-child { margin-top: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl th { color: var(--text-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.tbl td.num { white-space: nowrap; font-weight: 600; }
.formula { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; display: block; margin: 4px 0; overflow-x: auto; }
.src { color: var(--text-3); font-size: 12px; }
.steps { counter-reset: st; list-style: none; padding: 0; margin: 0; }
.steps li { position: relative; padding: 10px 0 10px 34px; border-bottom: 1px solid var(--border); font-size: 14px; }
.steps li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text-2); }

/* ---------- мобильная плашка ---------- */
.mbar { display: none; }
[hidden] { display: none !important; }
@media (max-width: 960px) {
  .calc-grid { grid-template-columns: minmax(0, 1fr); }
  .result { position: static; }
  .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); align-items: center; gap: 12px; box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
  .mbar .v { font-size: 26px; font-weight: 800; color: var(--accent-text); }
  .mbar .l { font-size: 12px; color: var(--text-3); line-height: 1.2; }
  .mbar .btn { margin-left: auto; }
}
@media (max-width: 600px) {
  main { padding: 16px 16px 110px; }
  .topbar-in { padding: 8px 16px; }
  .brand-name small { display: none; }
  .hero h1 { font-size: 26px; }
  .hero p { font-size: 16px; }
  .calc-head h1 { font-size: 21px; }
  .step { padding: 16px; }
  .fields { grid-template-columns: 1fr; }
  .res-big { font-size: 48px; }
  .toggle .tl { display: none; }
  .hide-sm { display: none !important; }
  .goal { padding: 14px; }
  .tbl td.num { white-space: normal; }
  .tbl td, .tbl th { padding: 6px 4px; overflow-wrap: anywhere; }
  .eng { padding: 14px; }
}
.eng { overflow-x: auto; }

/* ---------- история ---------- */
.hist-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.hist-list { display: grid; gap: 8px; }
.hist-item .meta { min-width: 0; }
.hist-item .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-item .ops { display: flex; gap: 4px; }

/* ---------- отчёт для печати ---------- */
#report { display: none; }
@media print {
  @page { size: A4; margin: 14mm 14mm 16mm; }
  body { background: #fff; color: #000; font-size: 10.5pt; }
  .topbar, main, .mbar { display: none !important; }
  #report { display: block; }
}
/* веб-версия (печать недоступна): отчёт показывается на экране как лист */
body.show-report main, body.show-report .mbar { display: none !important; }
body.show-report #report { display: block; padding-block: 16px 40px; padding-inline: 16px; }
.rep-bar { max-width: 860px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.rep-bar .muted { color: var(--text-3); font-size: 13px; flex: 1 1 260px; }
body.show-report .rep { max-width: 860px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); overflow-wrap: anywhere; }
body.show-report .rep table { table-layout: fixed; }
@media (max-width: 640px) { body.show-report .rep { padding: 14px; font-size: 10pt; } .rep .rep-result { flex-wrap: wrap; gap: 10px; } }
@media print { .rep-bar { display: none !important; } }
.rep { font: 10.5pt/1.45 "Segoe UI", Arial, sans-serif; color: #000; }
.rep-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #0b6e8a; padding-bottom: 8px; margin-bottom: 12px; }
.rep-head h1 { font-size: 17pt; margin: 0; letter-spacing: .5px; }
.rep-head .rep-date { font-size: 10pt; color: #333; text-align: right; }
.rep h2 { font-size: 12pt; margin: 14px 0 6px; color: #0b4f63; border-bottom: 1px solid #cfd8e3; padding-bottom: 3px; }
.rep table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
.rep td, .rep th { border: 1px solid #cfd8e3; padding: 4px 6px; text-align: left; vertical-align: top; }
.rep th { background: #eef3f7; }
.rep .rep-result { display: flex; gap: 24px; align-items: center; border: 1.5px solid #0b6e8a; border-radius: 8px; padding: 10px 14px; margin: 10px 0; page-break-inside: avoid; }
.rep .rep-result .v { font-size: 26pt; font-weight: 800; color: #0b4f63; }
.rep .formula { background: #f3f6f9; font-size: 9pt; }
.rep .foot { margin-top: 18px; font-size: 8.5pt; color: #555; border-top: 1px solid #cfd8e3; padding-top: 6px; }
.rep section, .rep tr { page-break-inside: avoid; }

</style>

<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/" aria-label="На главную">
      <span class="brand-mark">UF</span>
      <span class="brand-name">UNIONFLEX CALCULATOR<small>Расчёт толщины теплоизоляции</small></span>
    </a>
    <button type="button" class="btn ghost small theme-btn" id="themeBtn"></button>
    <label class="toggle" title="Показывать формулы, коэффициенты и промежуточные значения">
      <input type="checkbox" id="engToggle"><span class="switch"></span><span class="tl">Инженерный режим</span>

  </div>
</header>

<main id="main">

</main>

<div class="mbar" id="mbar" hidden></div>

<script>/* src/data/sp61.js */
/*
 * Нормативные данные СП 61.13330.2012 «Тепловая изоляция оборудования и трубопроводов»
 * (с Изменениями N 1, 2). Таблицы сверены с текстом СП (CALCULATION_METHOD.md, §3.3, §0.1).
 * Строки: [условный проход Dу, мм, значения по столбцам]. Отдельно — нормы для
 * плоских поверхностей и Dу > 1400 мм (для t ≤ 0 — Dу > 500 мм) — в Вт/м².
 */
(function (root) {
  var UF = root.UF = root.UF || {};
  UF.data = UF.data || {};

<script>/* src/core/base.js */
/*
 * Расчётное ядро UNIONFLEX CALCULATOR — базовые функции.
 * Не зависит от интерфейса и бренда. Методика: CALCULATION_METHOD.md (исправленная
 * методика исходной программы по СП 61.13330.2012 с Изм. 1, 2).
 */
(function (root) {
  var UF = root.UF = root.UF || {};
  var core = UF.core = UF.core || {};
  var PI = Math.PI;

  function CalcError(code, text, field) {
    this.code = code; this.text = text; this.field = field || null;
  }
  core.CalcError = CalcError;
  function fail(code, text, field) { throw new CalcError(code, text, field); }
  core.fail = fail;

  // ---------- интерполяция ----------

  // Линейная интерполяция по упорядоченному (по возрастанию или убыванию) массиву узлов.
  // Без экстраполяции: вне диапазона возвращает null.
  function locate(xs, x) {
    var n = xs.length, asc = xs[n - 1] >= xs[0];
    var lo = asc ? xs[0] : xs[n - 1], hi = asc ? xs[n - 1] : xs[0];
    if (x < lo - 1e-9 || x > hi + 1e-9) return null;
    for (var i = 0; i < n - 1; i++) {
      var a = xs[i], b = xs[i + 1];
      if ((x - a) * (x - b) <= 0) {
        var t = b === a ? 0 : (x - a) / (b - a);
        return { i: i, t: t };
      }
    }
    return { i: n - 1, t: 0 };
  }
  core.locate = locate;

  function interp1(xs, ys, x) {
    var p = locate(xs, x);
    if (!p) return null;
    if (p.i >= xs.length - 1) return ys[xs.length - 1];
    return ys[p.i] + (ys[p.i + 1] - ys[p.i]) * p.t;
  }
  core.interp1 = interp1;

  // Таблица: rowKeys[i] × colKeys[j] → rows[i][j]; билинейная интерполяция.
  function interp2(rowKeys, colKeys, rows, r, c) {
    var pr = locate(rowKeys, r), pc = locate(colKeys, c);
    if (!pr || !pc) return null;
    function rowVal(i) {
      var row = rows[i];
      if (pc.i >= colKeys.length - 1) return row[colKeys.length - 1];
      return row[pc.i] + (row[pc.i + 1] - row[pc.i]) * pc.t;
    }
    if (pr.i >= rowKeys.length - 1) return rowVal(rowKeys.length - 1);
    var a = rowVal(pr.i), b = rowVal(pr.i + 1);
    return a + (b - a) * pr.t;
  }
  core.interp2 = interp2;

  // ---------- решатель ----------

  // Поиск толщины δ (м), при которой убывающая функция g(δ) обращается в ноль.
  // g(0) ≤ 0 → изоляция по этому условию не нужна (возвращается 0).
  function solveThickness(g, maxDelta) {
    maxDelta = maxDelta || 1.0;
    var g0 = g(0);
    if (!(g0 > 0)) return { delta: 0, notNeeded: true, iterations: 0 };
    var gMax = g(maxDelta);
    if (gMax > 0) fail('too-thick', 'Требуемая толщина превышает ' + Math.round(maxDelta * 1000) + ' мм. Проверьте исходные данные или выберите другое условие расчёта.');
    var lo = 0, hi = maxDelta, it = 0;
    while (hi - lo > 1e-9 && it < 200) {
      var mid = (lo + hi) / 2;
      if (g(mid) > 0) lo = mid; else hi = mid;
      it++;
    }
    return { delta: hi, notNeeded: false, iterations: it };
  }
  core.solveThickness = solveThickness;

  // ---------- теплопроводность изоляции ----------

  function lambdaAt(model, tm) {
    if (model.type === 'linear') return model.A + model.B * tm;
    if (model.type === 'exp') return model.a * Math.exp(model.b * tm);
    if (model.type === 'constant') return model.value;
    fail('bad-lambda', 'Неизвестная модель теплопроводности материала');
  }
  core.lambdaAt = lambdaAt;

  function lambdaFormula(model) {
    if (model.type === 'linear') return 'λ = ' + fmt(model.A, 4) + ' + ' + fmt(model.B, 5) + '·t_ср';
    if (model.type === 'exp') return 'λ = ' + fmt(model.a, 4) + '·e^(' + fmt(model.b, 4) + '·t_ср)';
    return 'λ = ' + fmt(model.value, 4) + ' (постоянная)';
  }
  core.lambdaFormula = lambdaFormula;

  // ---------- теплоотдача ----------

  var SP = function () { return UF.data.sp61; };

  // kind: 'general' | 'surface' | 'condensation' | 'channel'
  function alphaOuter(kind, env, orientation, emissivity, wind) {
    var sp = SP();
    if (kind === 'channel' || env === 'channel') {
      return { value: sp.alphaChannel.value, ref: 'СП 61, ' + sp.alphaChannel.ref + ' (в канале)' };
    }
    if (kind === 'condensation') {
      return { value: sp.alphaCondensation[emissivity], ref: 'СП 61, ' + sp.alphaCondensation.ref };
    }
    if (kind === 'surface') {
      return { value: sp.alphaSurfaceTemp[emissivity], ref: sp.alphaSurfaceTemp.ref };
    }
    var ori = orientation === 'horizontal' ? 'horizontal' : 'vertical';
    if (env === 'outdoor') {
      var w = (wind === undefined || wind === null || wind === '') ? 10 : +wind;
      if (w < 5) w = 5;
      if (w > 15) w = 15;
      var a = interp1(sp.alphaB2.outdoorWind, sp.alphaB2.outdoor[ori], w);
      return { value: a, ref: 'СП 61, ' + sp.alphaB2.ref + ', на открытом воздухе, ветер ' + fmt(w, 1) + ' м/с' };
    }
    return { value: sp.alphaB2.room[ori][emissivity], ref: 'СП 61, ' + sp.alphaB2.ref + ', в закрытом помещении' };
  }
  core.alphaOuter = alphaOuter;

  // Свойства сухого воздуха по табл. В.7 СП 61
  function airProps(t) {
    var tab = SP().airProps, ts = tab.map(function (r) { return r[0]; });
    function col(k) { return interp1(ts, tab.map(function (r) { return r[k]; }), t); }
    if (col(1) === null) fail('air-range', 'Свойства воздуха заданы в СП 61 (табл. В.7) для 0…300 °C', 'tIn');
    return { rho: col(1), cp: col(2), lambda: col(3) / 100, nu: col(4) * 1e-6, pr: col(5) };
  }
  core.airProps = airProps;

  // Внутренняя теплоотдача в воздуховоде: Nu = 0,021·Re^0,8·Pr^0,43 (СП 61, В.34д)
  function alphaInnerDuct(tGas, speed, dEq) {
    var p = airProps(tGas);
    var re = speed * dEq / p.nu;
    var nu = 0.021 * Math.pow(re, 0.8) * Math.pow(p.pr, 0.43);
    return { value: nu * p.lambda / dEq, re: re, nu: nu, props: p, ref: 'СП 61, формула (В.34д)' };
  }
  core.alphaInnerDuct = alphaInnerDuct;

  // ---------- влажный воздух ----------

  // Давление насыщенного водяного пара над водой, кПа. Формула исходной программы
  // (первоисточник не установлен; проверена по справочным данным: 0,6095 кПа при 0 °C,
  // 2,340 кПа при 20 °C — погрешность < 1 % в диапазоне 0…40 °C).
  function saturation(t) { return Math.exp((16.57 * t - 115.72) / (233.77 + 0.997 * t)); }
  function dewPoint(t, rh) {
    var e = rh / 100 * saturation(t), l = Math.log(e);
    return (233.77 * l + 115.72) / (16.57 - 0.997 * l);
  }
  core.dewPoint = dewPoint;

  // Расчётный перепад tн − tп по табл. В.4 СП 61
  function deltaTCondensation(tAir, rh) {
    var t = SP().deltaTB4;
    var v = interp2(t.tAir, t.rh, t.rows, tAir, rh);
    return v === null ? null : { value: v, ref: 'СП 61, ' + t.ref };
  }
  core.deltaTCondensation = deltaTCondensation;

  // ---------- геометрия и условный проход ----------

  function dnFromOd(od) {
    var tab = UF.data.pipes.steelOdToDn;
    return interp1(tab.map(function (r) { return r[0]; }), tab.map(function (r) { return r[1]; }), od);
  }
  core.dnFromOd = dnFromOd;

  function plasticWall(od) {
    var tab = UF.data.pipes.plasticWall;
    return interp1(tab.map(function (r) { return r[0]; }), tab.map(function (r) { return r[1]; }), od);
  }
  core.plasticWall = plasticWall;

  // ---------- нормы плотности теплового потока ----------

  // env: 'outdoor' | 'room' | 'tunnel' | 'channel'; hours: 'gt5000' | 'le5000'
  // geom: { type: 'cyl', dn } | { type: 'flat' }
  function normFor(env, hours, tIn, geom) {
    var sp = SP(), key, envLabel;
    var outdoorLike = env === 'outdoor' || env === 'channel';
    if (outdoorLike) {
      envLabel = env === 'channel' ? 'в канале (как на открытом воздухе, п. 6.1.1)' : 'на открытом воздухе';
      if (tIn >= 20) key = hours === 'le5000' ? 'air5000' : 'air9000';
      else if (tIn <= 0) key = 'airNeg';
      else fail('norm-gap', 'СП 61 не устанавливает нормы теплопотерь на открытом воздухе для веществ с температурой от 0 до 20 °C (табл. 2, 3 начинаются с 20 °C, табл. 6 — от 0 °C и ниже). Выберите расчёт «Защитить от конденсата» или «Заданные теплопотери».', 'tIn');
    } else {
      envLabel = env === 'tunnel' ? 'в тоннеле (как в помещении)' : 'в помещении';
      if (tIn >= 50) key = hours === 'le5000' ? 'room5000' : 'room9000';
      else if (tIn <= 0) key = 'roomNeg';
      else fail('norm-gap', 'СП 61 не устанавливает нормы теплопотерь в помещении для веществ с температурой от 0 до 50 °C (табл. 4, 5 начинаются с 50 °C). Для горячей воды ниже 50 °C выберите «Заданные теплопотери», для холодных сред — «Защитить от конденсата».', 'tIn');
    }
    var tab = sp.norms[key];
    var tMin = Math.min.apply(null, tab.temps), tMax = Math.max.apply(null, tab.temps);
    if (tIn < tMin || tIn > tMax) fail('norm-range', 'Нормы СП 61 (' + tab.ref + ') заданы для температуры ' + tMin + '…' + tMax + ' °C.', 'tIn');

    var useSurface = geom.type === 'flat' || geom.dn > tab.surfaceFromDy;
    if (useSurface) {
      var qF = interp1(tab.temps, tab.surface, tIn);
      return { type: 'surface', value: qF, unit: 'Вт/м²', key: key,
        ref: 'СП 61, ' + tab.ref + ', ' + envLabel + ', строка «плоские поверхности и Dу > ' + tab.surfaceFromDy + ' мм»' };
    }
    var dns = tab.linear.map(function (r) { return r[0]; });
    if (geom.dn < dns[0] - 1e-9) fail('dn-small', 'Нормы СП 61 (' + tab.ref + ') начинаются с условного прохода ' + dns[0] + ' мм; для трубы Dу ' + fmt(geom.dn, 1) + ' мм норма не установлена. Выберите «Защитить от конденсата» или «Заданные теплопотери».', 'od');
    var rows = tab.linear.map(function (r) { return r.slice(1); });
    var q = interp2(dns, tab.temps, rows, geom.dn, tIn);
    return { type: 'linear', value: q, unit: 'Вт/м', key: key,
      ref: 'СП 61, ' + tab.ref + ', ' + envLabel + ', интерполяция по Dу = ' + fmt(geom.dn, 1) + ' мм и t = ' + fmt(tIn, 1) + ' °C' };
  }
  core.normFor = normFor;

  // ---------- теплопередача через изолированную стенку ----------

  /*
   * p = { geom: 'cyl'|'flat', d (м, наружный диаметр трубы), tIn, tOut, alpha,
   *       lambdaModel, rInner(stateGuess) → { value, label } (опц.),
   *       rOuter (опц., канал+грунт) }
   * Возвращает поток q (Вт/м или Вт/м²; знак: >0 — от вещества к среде), температуры.
   * λ определяется при средней температуре изоляционного слоя методом последовательных
   * приближений (СП 61, п. В.1).
   */
  function heatState(p, delta) {
    var cyl = p.geom === 'cyl';
    var D = cyl ? p.d + 2 * delta : null;
    var Rn = cyl ? 1 / (PI * D * p.alpha) : 1 / p.alpha;
    var rOut = p.rOuter || 0;
    var tm = (p.tIn + p.tOut) / 2, lam = lambdaAt(p.lambdaModel, tm), res = null;
    var rIn = 0, tWallOut = p.tIn;
    for (var k = 0; k < 100; k++) {
      lam = lambdaAt(p.lambdaModel, tm);
      if (!(lam > 0)) fail('lambda-neg', 'Теплопроводность материала вне допустимой области при t = ' + fmt(tm, 1) + ' °C');
      var Riz = delta > 0 ? (cyl ? Math.log(D / p.d) / (2 * PI * lam) : delta / lam) : 0;
      rIn = p.rInner ? p.rInner({ tIn: p.tIn, tWallOut: tWallOut }).value : 0;
      var Rtot = rIn + Riz + Rn + rOut;
      var q = (p.tIn - p.tOut) / Rtot;
      tWallOut = p.tIn - q * rIn;
      var tSurf = tWallOut - q * Riz;
      var tmNew = (tWallOut + tSurf) / 2;
      res = { q: q, tSurf: tSurf, tWallOut: tWallOut, tAmbLocal: p.tOut + q * rOut,
        lambda: lam, tm: tmNew, Riz: Riz, Rn: Rn, rIn: rIn, rOut: rOut, Rtot: Rtot, D: D, delta: delta };
      if (Math.abs(tmNew - tm) < 1e-7) break;
      tm = tmNew;
    }
    return res;
  }
  core.heatState = heatState;

  // ---------- форматирование ----------

  function fmt(x, n) {
    if (x === null || x === undefined || isNaN(x)) return '—';
    var s = (+x).toFixed(n === undefined ? 2 : n);
    return s.replace('.', ',');
  }
  core.fmt = fmt;
  core.PI = PI;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/core/selection.js */
/*
 * Принятая (стандартная) толщина — СП 61.13330.2012:
 *  п. 6.12 — для вспененного каучука принимается ближайшая большая номенклатурная толщина;
 *            при расчёте по нормам плотности потока и по температуре поверхности допускается
 *            ближайшая меньшая, если разница не превышает 3 мм;
 *  п. 6.11 — несколько слоёв одного материала рассматриваются как однослойная конструкция;
 *  п. 6.16 — при температуре ниже −60 °C однослойная конструкция не допускается.
 */
(function (root) {
  var UF = root.UF = root.UF || {};
  var core = UF.core = UF.core || {};
  var fmt = function (x, n) { return core.fmt(x, n); };

  function pad(n, w) { var s = String(Math.round(n)); while (s.length < w) s = '0' + s; return s; }

  // Трубки, выпускаемые для наружного диаметра трубы od (мм)
  function tubesFor(material, od) {
    var tube = material.products.tube;
    if (!tube || !(od > 0) || od > tube.maxOd) return [];
    var out = [];
    tube.sizes.forEach(function (row) {
      if (od >= row[0] - 1e-9 && od <= row[1] + 1e-9) {
        row[3].forEach(function (s) { out.push({ s: s, id: row[2] }); });
      }
    });
    out.sort(function (a, b) { return a.s - b.s; });
    return out;
  }
  core.tubesFor = tubesFor;

  // Минимальная по сумме комбинация до maxLayers слоёв рулона, не меньше need (мм)
  function bestCombo(list, need, minLayers, maxLayers) {
    var best = null;
    function rec(start, layers, sum) {
      if (layers.length >= minLayers && sum >= need - 1e-9) {
        if (!best || sum < best.sum - 1e-9 || (Math.abs(sum - best.sum) < 1e-9 && layers.length < best.layers.length)) {
          best = { sum: sum, layers: layers.slice() };
        }
        return;
      }
      if (layers.length >= maxLayers) return;
      for (var i = start; i < list.length; i++) { layers.push(list[i]); rec(i, layers, sum + list[i]); layers.pop(); }
    }
    rec(0, [], 0);
    if (best) best.layers.sort(function (a, b) { return b - a; });
    return best;
  }

  /*
   * opts: { material, od (мм, для трубы) | null, geom: 'cyl'|'flat', productPref: 'auto'|'tube'|'roll',
   *         allowLower (bool — расчёт по нормам или по t поверхности), tMin (минимальная t объекта, °C),
   *         protective (bool — конденсат/замерзание) }
   */
  function selectThickness(deltaCalcMm, opts) {
    var m = opts.material, notes = [], alternatives = [];
    var singleForbidden = opts.tMin !== undefined && opts.tMin < -60;
    if (singleForbidden) notes.push('Температура ниже −60 °C: однослойная конструкция не допускается (СП 61, п. 6.16) — принята многослойная.');

    if (!(deltaCalcMm >= 1)) {
      var res0 = { accepted: 0, product: null, alternatives: [], notes: notes, notNeeded: true };
      if (opts.protective) {
        var minS = minAvailable(m, opts);
        if (minS) res0.suggestion = minS;
      }
      return res0;
    }

    var roll = m.products.roll;
    var rollList = roll ? roll.thicknesses.slice().sort(function (a, b) { return a - b; }) : [];
    var result = null;

    // 1. Трубка (только для трубы, если есть в сортаменте марки)
    var tubes = (opts.geom === 'cyl' && opts.productPref !== 'roll' && m.products.tube) ? tubesFor(m, opts.od) : [];
    if (!singleForbidden && tubes.length) {
      var t = tubes.filter(function (x) { return x.s >= deltaCalcMm - 1e-9; })[0];
      if (t) {
        result = { accepted: t.s, product: { kind: 'tube', layers: [t.s], innerDiameter: t.id,
          code: m.name + ' ' + pad(t.s, 2) + '×' + pad(t.id, 3), label: 'Трубка ' + pad(t.s, 2) + '×' + pad(t.id, 3) + ' мм' } };
        if (opts.allowLower) {
          var lower = tubes.filter(function (x) { return x.s < deltaCalcMm && deltaCalcMm - x.s <= 3 + 1e-9; }).pop();
          if (lower) alternatives.push({ accepted: lower.s, text: 'Допускается трубка ' + pad(lower.s, 2) + '×' + pad(lower.id, 3) + ' (меньше расчётной на ' + fmt(deltaCalcMm - lower.s, 1) + ' мм ≤ 3 мм, СП 61 п. 6.12)' });
        }
      } else {
        notes.push('Трубки для диаметра ' + fmt(opts.od, 1) + ' мм выпускаются толщиной до ' + tubes[tubes.length - 1].s + ' мм — принят рулонный материал.');
      }
    } else if (opts.geom === 'cyl' && opts.productPref === 'tube' && m.products.tube && !tubes.length) {
      notes.push('Для наружного диаметра ' + fmt(opts.od, 1) + ' мм трубка ' + m.name + ' не выпускается — принят рулон.');
    } else if (opts.geom === 'cyl' && opts.productPref === 'tube' && !m.products.tube) {
      notes.push(m.name + ' выпускается только в рулонах.');
    }

    // 2. Рулон (одно- или многослойно)
    if (!result) {
      if (!rollList.length) core.fail('no-product', 'Для материала нет подходящих изделий.');
      var single = singleForbidden ? null : rollList.filter(function (s) { return s >= deltaCalcMm - 1e-9; })[0];
      if (single) {
        result = { accepted: single, product: { kind: 'roll', layers: [single], code: m.name + ' рулон ' + pad(single, 2) + ' мм', label: 'Рулон ' + single + ' мм' } };
        if (opts.allowLower) {
          var lowerR = rollList.filter(function (s) { return s < deltaCalcMm && deltaCalcMm - s <= 3 + 1e-9; }).pop();
          if (lowerR) alternatives.push({ accepted: lowerR, text: 'Допускается рулон ' + lowerR + ' мм (меньше расчётной на ' + fmt(deltaCalcMm - lowerR, 1) + ' мм ≤ 3 мм, СП 61 п. 6.12)' });
        }
      } else {
        var combo = bestCombo(rollList, deltaCalcMm, singleForbidden ? 2 : 2, 4);
        if (!combo) core.fail('too-thick-product', 'Требуемая толщина ' + fmt(deltaCalcMm, 1) + ' мм не набирается из 4 слоёв рулона. Проверьте исходные данные.');
        result = { accepted: combo.sum, product: { kind: 'roll', layers: combo.layers,
          code: m.name + ' рулон, ' + combo.layers.length + ' слоя: ' + combo.layers.join(' + ') + ' мм',
          label: combo.layers.length + ' слоя рулона: ' + combo.layers.join(' + ') + ' мм' } };
        if (!singleForbidden) notes.push('Расчётная толщина больше максимальной выпускаемой (' + rollList[rollList.length - 1] + ' мм) — многослойная конструкция из однородного материала рассматривается как однослойная (СП 61, п. 6.11).');
        notes.push('Слои укладываются с перекрытием швов предыдущего слоя.');
      }
    }
    result.alternatives = alternatives;
    result.notes = notes;
    result.rule = 'СП 61.13330.2012, п. 6.12: принимается ближайшая большая номенклатурная толщина';
    return result;
  }
  core.selectThickness = selectThickness;

  function minAvailable(m, opts) {
    var tubes = opts.geom === 'cyl' && m.products.tube ? tubesFor(m, opts.od) : [];
    if (tubes.length) return { s: tubes[0].s, text: 'Минимальная выпускаемая трубка: ' + pad(tubes[0].s, 2) + '×' + pad(tubes[0].id, 3) };
    var r = m.products.roll ? m.products.roll.thicknesses.slice().sort(function (a, b) { return a - b; })[0] : null;
    return r ? { s: r, text: 'Минимальный выпускаемый рулон: ' + r + ' мм' } : null;
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>

(function (root) {

    flow:          { label: 'Расход', type: 'number', group: 'conditions', min: 0.0001, max: 1e7, step: 0.001 },

                     options: [['kgh', 'кг/ч'], ['m3h', 'м³/ч'], ['ms', 'м/с (скорость)']] },

    fluidC:        { label: 'Теплоёмкость вещества', unit: 'кДж/(кг·°C)', type: 'number', group: 'conditions', min: 0.1, max: 10, step: 0.01 },
    qGiven:        { label: 'Допустимые теплопотери', type: 'number', group: 'conditions', min: 0.1, max: 100000, step: 0.1 },
    thicknessGiven:{ label: 'Толщина изоляции', unit: 'мм', type: 'number', group: 'conditions', min: 1, max: 500, step: 1 },
    gasRh:         { label: 'Влажность газа (воздуха) внутри', unit: '%', type: 'number', group: 'conditions', min: 5, max: 100, default: 60 },

                     options: [['95-70', '95/70 °C'], ['150-70', '150/70 °C'], ['180-70', '180/70 °C'], ['custom', 'Постоянная температура (количественное регулирование)']] },
    tSupply:       { label: 'Температура в подающей трубе', unit: '°C', type: 'number', group: 'conditions', min: 20, max: 200 },
    operation:     { label: 'Режим работы сети', type: 'choice', group: 'conditions', default: 'year',
                     options: [['year', 'Круглый год'], ['season', 'Только отопительный период']] },
    seasonDays:    { label: 'Отопительный период', unit: 'сут', type: 'number', group: 'conditions', min: 1, max: 365, default: 205 },

                     options: [['auto', 'Подобрать автоматически'], ['tube', 'Трубка'], ['roll', 'Рулон']] },

  };
  core.FIELDS = FIELDS;

  var OBJECT_LABELS = { pipe: 'Трубопровод', flat: 'Ёмкость / плоская поверхность', duct: 'Воздуховод', tank: 'Ёмкость с водой' };
  var ENV_LABELS = { outdoor: 'На улице', room: 'В помещении', tunnel: 'В тоннеле', channel: 'В непроходном канале' };
  core.OBJECT_LABELS = OBJECT_LABELS; core.ENV_LABELS = ENV_LABELS;

  // ---------------------------------------------------------------- подготовка

  function num(inp, id, required) {
    var v = inp[id], f = FIELDS[id] || {};
    if (v === undefined || v === null || v === '') {
      if (f.default !== undefined && typeof f.default === 'number') return f.default;
      if (required === false) return null;
      fail('empty', 'Заполните поле «' + (f.label || id) + '».', id);
    }
    var x = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.').replace(/\s/g, ''));
    if (!isFinite(x)) fail('nan', 'В поле «' + (f.label || id) + '» должно быть число.', id);
    if (f.min !== undefined && x < f.min) fail('min', '«' + f.label + '»: значение должно быть не меньше ' + fmt(f.min, f.min % 1 ? 1 : 0) + (f.unit ? ' ' + f.unit : '') + '.', id);
    if (f.max !== undefined && x > f.max) fail('max', '«' + f.label + '»: значение должно быть не больше ' + fmt(f.max, f.max % 1 ? 1 : 0) + (f.unit ? ' ' + f.unit : '') + '.', id);
    return x;
  }
  function opt(inp, id) { var v = inp[id]; return (v === undefined || v === null || v === '') ? FIELDS[id].default : v; }

  function material(inp) {
    var id = opt(inp, 'materialId');
    var m = UF.data.materials.filter(function (x) { return x.id === id; })[0];
    if (!m) fail('material', 'Выберите материал.', 'materialId');
    var modelKey = inp.lambdaModel && m.lambdaModels[inp.lambdaModel] ? inp.lambdaModel : m.defaultLambda;
    var cov = opt(inp, 'covering');
    var allCov = [];
    Object.keys(m.products).forEach(function (k) { allCov = allCov.concat(m.products[k].coverings); });
    if (allCov.indexOf(cov) < 0) cov = 'none';
    return { m: m, model: m.lambdaModels[modelKey], modelKey: modelKey, coveringId: cov, covering: UF.data.coverings[cov] };
  }

  // Геометрия объекта: { geom: 'cyl'|'flat', d (м), od (мм), dn, dEq (м), perimeter (м), label }
  function geometry(inp, obj) {
    if (obj === 'pipe') {
      var od = num(inp, 'od'), dn = core.dnFromOd(od);
      if (dn === null) dn = od > 1420 ? 1500 : 0;
      return { geom: 'cyl', d: od / 1000, od: od, dn: dn, label: 'труба Ø' + fmt(od, od % 1 ? 1 : 0) + ' мм' };
    }
    if (obj === 'duct') {
      if (opt(inp, 'ductShape') === 'rect') {
        var a = num(inp, 'ductA'), b = num(inp, 'ductB');
        return { geom: 'flat', rect: true, a: a / 1000, b: b / 1000, dEq: 2 * a * b / (a + b) / 1000, perimeter: 2 * (a + b) / 1000,
          label: 'воздуховод ' + a + '×' + b + ' мм' };
      }
      var dd = num(inp, 'ductD');
      if (dd >= 2000) return { geom: 'flat', d: dd / 1000, dEq: dd / 1000, perimeter: PI * dd / 1000, label: 'воздуховод Ø' + dd + ' мм (как плоская стенка, D ≥ 2 м — СП 61 (В.16))' };
      return { geom: 'cyl', d: dd / 1000, od: dd, dn: core.dnFromOd(dd), dEq: dd / 1000, label: 'воздуховод Ø' + dd + ' мм' };
    }
    return { geom: 'flat', label: obj === 'tank' ? 'ёмкость' : 'плоская поверхность' };
  }

  function emissivityOf(mat) { return mat.covering.emissivity; }

  // Сопротивление стенки пластиковой трубы (СП 61 п. 6.37, (В.7))
  function plasticWallR(inp, g, steps) {
    if (inp.object !== 'pipe' || opt(inp, 'pipeMaterial') !== 'plastic') return null;
    var s = num(inp, 'wallPlastic', false);
    if (s === null) s = core.plasticWall(g.od);
    if (s === null) fail('wall', 'Укажите толщину стенки пластиковой трубы.', 'wallPlastic');
    if (2 * s >= g.od) fail('wall', 'Толщина стенки должна быть меньше половины диаметра.', 'wallPlastic');
    var pl = UF.data.pipes.plasticLambda, ln = Math.log(g.od / (g.od - 2 * s));
    steps.push({ title: 'Стенка пластиковой трубы', formula: 'R_ст = ln(d/(d − 2s)) / (2π·λ_ст), λ_ст = ' + fmt(pl.A, 2) + ' + ' + fmt(pl.B, 3) + '·t',
      values: 's = ' + fmt(s, 1) + ' мм', ref: 'СП 61, (В.7), п. 6.37; λ_ст — ' + pl.source });
    return function (st) {
      var tm = (st.tIn + st.tWallOut) / 2, lam = pl.A + pl.B * tm;
      return { value: ln / (2 * PI * lam) };
    };
  }

  function channelR(inp, g, steps) {
    var H = num(inp, 'depthH'), b = num(inp, 'chanB'), h = num(inp, 'chanH');
    if (H <= h / 2) fail('channel', 'Глубина заложения оси канала должна быть больше половины его высоты.', 'depthH');
    var soilId = opt(inp, 'soil'), soil = UF.data.sp61.soils.filter(function (s) { return s.id === soilId; })[0];
    if (!soil) fail('soil', 'Выберите грунт.', 'soil');
    var ak = UF.data.sp61.alphaChannel.value;
    var dEq = 2 * b * h / (b + h);
    var Rkan = 1 / (PI * ak * dEq);
    var Rgr = Math.log(3.5 * (H / h) * Math.pow(h / b, 0.25)) / ((5.7 + 0.5 * b / h) * soil.value);
    if (!(Rgr > 0)) fail('channel', 'Для заданных размеров канала формула СП 61 (В.40) неприменима. Проверьте глубину и размеры.', 'depthH');
    steps.push({ title: 'Канал и грунт', formula: 'R_кан = 1/(π·α_к·2bh/(b+h)); R_гр = ln[3,5·(H/h)·(h/b)^0,25] / ((5,7 + 0,5·b/h)·λ_гр)',
      values: 'α_к = ' + ak + ' Вт/(м²·°C), b = ' + fmt(b) + ' м, h = ' + fmt(h) + ' м, H = ' + fmt(H) + ' м, λ_гр = ' + fmt(soil.value) + ' Вт/(м·°C) (' + soil.label + ')',
      result: 'R_кан = ' + fmt(Rkan, 4) + ', R_гр = ' + fmt(Rgr, 4) + ' м·°C/Вт', ref: 'СП 61, (В.39), (В.40), табл. В.6' });
    return { value: Rkan + Rgr, Rkan: Rkan, Rgr: Rgr, b: b, h: h };
  }

  function checkTemps(mat, tMin, tMax, warnings, errors) {
    var m = mat.m, r = m.tempRange;
    var lowLimit = r[0];
    if (tMax > r[1] + 1e-9) fail('mat-temp', m.name + ' применяется до +' + r[1] + ' °C, а температура объекта +' + fmt(tMax, 1) + ' °C.', 'tIn');
    if (tMin < r[0] - 1e-9) {
      if (m.multilayerMin !== undefined && tMin >= m.multilayerMin) warnings.push({ code: 'multilayer', text: m.name + ' ниже ' + r[0] + ' °C применяется только в многослойной конструкции (' + m.tempNotes + ').' });
      else fail('mat-temp', m.name + ' применяется от ' + r[0] + ' °C, а температура объекта ' + fmt(tMin, 1) + ' °C.', 'tIn');
    }
    if (mat.model.maxTemp !== undefined && tMax > mat.model.maxTemp) warnings.push({ code: 'lambda-range', text: 'Зависимость теплопроводности (СП 61, табл. Б.5) установлена до ' + mat.model.maxTemp + ' °C.' });
    var cr = mat.covering.tempRange;
    if (cr && (tMin < cr[0] || tMax > cr[1])) fail('cov-temp', 'Исполнение «' + mat.covering.label + '» применяется при температуре ' + cr[0] + '…+' + cr[1] + ' °C. Выберите другое покрытие.', 'covering');
  }

  // ---------------------------------------------------------------- общий каркас

  function context(inp, calc) {
    var obj = inp.object && calc.objects.indexOf(inp.object) >= 0 ? inp.object : calc.objects[0];
    var env = inp.env && calc.envs(obj).indexOf(inp.env) >= 0 ? inp.env : calc.envs(obj)[0];
    var ctx = { inp: inp, obj: obj, env: env, steps: [], warnings: [], coefficients: [], refs: [] };
    ctx.mat = material(inp);
    ctx.g = geometry(inp, obj);
    ctx.steps.push({ title: 'Объект', values: OBJECT_LABELS[obj] + ', ' + ctx.g.label + ', ' + ENV_LABELS[env] });
    ctx.coefficients.push({ name: 'Теплопроводность изоляции', value: core.lambdaFormula(ctx.mat.model), unit: 'Вт/(м·°C)', source: ctx.mat.model.source });
    return ctx;
  }

  function airDefault(inp, env) {
    if (inp.tAir !== undefined && inp.tAir !== null && inp.tAir !== '') return num(inp, 'tAir');

    if (env === 'tunnel') return 40;

  }

  function stateParams(ctx, over) {
    var p = { geom: ctx.g.geom, d: ctx.g.d, lambdaModel: ctx.mat.model };
    for (var k in over) p[k] = over[k];
    return p;
  }

  function finishThickness(ctx, sol, p, extra) {

      ref: extra.ref });
    return {
      thicknessCalc_mm: sol.notNeeded ? 0 : deltaMm,
      thicknessAccepted_mm: sel.accepted,
      notNeeded: !!sel.notNeeded,
      selection: sel,
      atCalc: st,
      atAccepted: acc

  }

  function unitQ(g) { return g.geom === 'cyl' ? 'Вт/м' : 'Вт/м²'; }

  // ---------------------------------------------------------------- расчёты

  var CALCS = [];

  // 1. Конденсация на поверхности (СП 61 п. 6.8, В.2.4)
  CALCS.push({
    id: 'condensation', icon: 'droplet', title: 'Защитить от конденсата',

      else {

      }
      var tS = tAir - dT.value;

      ctx.coefficients.push({ name: 'Допустимый перепад tн − tп', value: fmt(dT.value, 2), unit: '°C', source: dT.ref });
      ctx.coefficients.push({ name: 'Коэффициент теплоотдачи α', value: fmt(a.value, 1), unit: 'Вт/(м²·°C)', source: a.ref + ' (' + ctx.mat.covering.label + ')' });
      ctx.steps.push({ title: 'Минимальная температура поверхности', formula: 't_п = t_н − Δt', values: 't_н = ' + fmt(tAir, 1) + ' °C, Δt = ' + fmt(dT.value, 2) + ' °C', result: 't_п = ' + fmt(tS, 2) + ' °C', ref: dT.ref });
      var p = stateParams(ctx, { tIn: tIn, tOut: tAir, alpha: a.value, rInner: plasticWallR(inp, ctx.g, ctx.steps) });
      var sol = core.solveThickness(function (d) { return (tAir - core.heatState(p, d).tSurf) - dT.value; });
      var r = finishThickness(ctx, sol, p, { protective: true, tMin: tIn,
        condition: ctx.g.geom === 'cyl' ? 'ln(D/d) = 2πλ·R_н·(t_п − t_в)/(t_н − t_п), R_н = 1/(π·D·α)' : 'δ = λ·(t_п − t_в)/(α·(t_н − t_п))',
        ref: 'СП 61, (В.33), (В.34)' });

      r.extra = [{ label: 'Температура поверхности при принятой толщине', value: r.atAccepted ? fmt(r.atAccepted.tSurf, 1) + ' °C' : '—' },

  });

  // 2. По нормам плотности теплового потока (СП 61 п. 6.1, В.2.1)
  CALCS.push({

  // 3. По заданной температуре поверхности (СП 61 п. 6.7, В.2.3)
  CALCS.push({

      var p = stateParams(ctx, { tIn: tIn, tOut: tAir, alpha: a.value, rInner: plasticWallR(inp, ctx.g, ctx.steps) });

  // 4. Защита от замерзания (СП 61 п. 6.6, В.2.7)
  CALCS.push({
    id: 'freezing', icon: 'snowflake', title: 'Не допустить замерзания',
    short: 'Вода не замёрзнет, пока движение остановлено',
    objects: ['pipe', 'tank'],

    fields: function (i) {

      }
      f = f.concat(['env', 'tIn', 'tAir', 'stopHours', 'freezeFraction']);
      if (i.env === 'outdoor') f.push('wind');
      if (i.env === 'channel') f = f.concat(['depthH', 'chanB', 'chanH', 'soil']);
      return f.concat(matFields(i));
    },
    compute: function (ctx) {
      var inp = ctx.inp, tIn = num(inp, 'tIn'), tAir = num(inp, 'tAir'), Z = num(inp, 'stopHours');
      var w = UF.data.fluids.water, tz = w.freezeTemp, frac = num(inp, 'freezeFraction') / 100;
      if (!(tAir < tz)) fail('temps', 'Замерзание возможно только при отрицательной температуре воздуха.', 'tAir');
      if (!(tIn > tz)) fail('temps', 'Начальная температура воды должна быть выше 0 °C.', 'tIn');

      var tMean = (tIn + tz) / 2;
      var rhoW = core.interp1(w.table.map(function (r) { return r[0]; }), w.table.map(function (r) { return r[1]; }), Math.max(0, tMean));
      var cW = core.interp1(w.table.map(function (r) { return r[0]; }), w.table.map(function (r) { return r[2]; }), Math.max(0, tMean));
      var Vl, VwRhoC, perUnit, a, rOut = 0, geomNote;
      if (ctx.obj === 'pipe') {

        if (pm === 'plastic') { s = num(inp, 'wallPlastic', false); if (s === null) s = core.plasticWall(ctx.g.od); rhoS = num(inp, 'plasticRho'); cS = num(inp, 'plasticC'); }
        else { s = num(inp, 'wallMetal'); rhoS = UF.data.pipes.wall[pm].rho; cS = UF.data.pipes.wall[pm].c; }
        var dIn = ctx.g.d - 2 * s / 1000;
        if (!(dIn > 0)) fail('wall', 'Толщина стенки слишком велика для этого диаметра.', pm === 'plastic' ? 'wallPlastic' : 'wallMetal');
        Vl = PI * dIn * dIn / 4;
        var Vs = PI * (ctx.g.d * ctx.g.d - dIn * dIn) / 4;
        VwRhoC = Vs * rhoS * cS;

        a = ctx.env === 'channel' ? core.alphaOuter('channel', 'channel') : core.alphaOuter('general', ctx.env, opt(inp, 'orientation'), emissivityOf(ctx.mat), num(inp, 'wind', false));

  });

  // Общая часть расчётов «по нормам» и «по заданному потоку»
  function normLike(ctx, mode) {
    var inp = ctx.inp, tIn = num(inp, 'tIn'), tAir = airDefault(inp, ctx.env);
    if (tIn === tAir) fail('temps', 'Температуры вещества и среды совпадают — теплового потока нет.', 'tIn');
    checkTemps(ctx.mat, Math.min(tIn, tAir), Math.max(tIn, tAir), ctx.warnings);
    var geomKey = ctx.g.geom === 'cyl' ? { type: 'cyl', dn: ctx.g.dn } : { type: 'flat' };
    var norm;
    if (mode === 'norm') {
      norm = core.normFor(ctx.env, opt(inp, 'hours'), tIn, geomKey);
      ctx.coefficients.push({ name: 'Норма плотности теплового потока', value: fmt(norm.value, 1), unit: norm.unit, source: norm.ref });
    } else {
      var q = num(inp, 'qGiven');
      norm = { type: ctx.g.geom === 'cyl' ? 'linear' : 'surface', value: q, unit: unitQ(ctx.g), ref: 'задано пользователем' };
      ctx.coefficients.push({ name: 'Допустимые теплопотери', value: fmt(q, 1), unit: norm.unit, source: 'задано пользователем (СП 61, п. 6.2)' });
    }
    var a, rOut = 0, ch = null;
    if (ctx.env === 'channel') { a = core.alphaOuter('channel', 'channel'); ch = channelR(inp, ctx.g, ctx.steps); rOut = ch.value; }
    else a = core.alphaOuter('general', ctx.env, ctx.obj === 'pipe' ? opt(inp, 'orientation') : 'vertical', emissivityOf(ctx.mat), num(inp, 'wind', false));
    ctx.coefficients.push({ name: 'Коэффициент теплоотдачи α', value: fmt(a.value, 1), unit: 'Вт/(м²·°C)', source: a.ref + ' (' + ctx.mat.covering.label + ')' });
    var p = stateParams(ctx, { tIn: tIn, tOut: tAir, alpha: a.value, rOuter: rOut, rInner: plasticWallR(inp, ctx.g, ctx.steps) });
    var surfaceOnCyl = norm.type === 'surface' && ctx.g.geom === 'cyl';
    var g = function (d) {
      var st = core.heatState(p, d);
      return (surfaceOnCyl ? Math.abs(st.q) / (PI * st.D) : Math.abs(st.q)) - norm.value;
    };
    var sol = core.solveThickness(g);
    var cond = surfaceOnCyl ? '|q_L| / (π·D) = q_F (норма на 1 м² поверхности изоляции, СП 61 (1))'
      : ctx.g.geom === 'cyl' ? 'ln(D/d) = 2πλ·[(t_в − t_н)/q_L' + (rOut ? ' − R_кан − R_гр' : '') + ' − R_н], R_н = 1/(π·D·α)' : 'δ = λ·[(t_в − t_н)/q_F − 1/α]';
    var r = finishThickness(ctx, sol, p, { allowLower: mode === 'norm', tMin: Math.min(tIn, tAir), condition: cond, ref: ctx.g.geom === 'cyl' ? 'СП 61, (В.19), (В.20)' : 'СП 61, (В.18)' });
    var qAcc = r.atAccepted ? Math.abs(r.atAccepted.q) : null;
    r.explanation = r.notNeeded ? 'Теплопотери и без изоляции не превышают ' + fmt(norm.value, 1) + ' ' + norm.unit + '.'
      : 'Чтобы теплопотери не превышали ' + (mode === 'norm' ? 'норму СП 61 — ' : '') + fmt(norm.value, 1) + ' ' + norm.unit + ', нужно ' + fmt(r.thicknessCalc_mm, 1) + ' мм изоляции.';
    r.extra = [{ label: (mode === 'norm' ? 'Норма' : 'Допустимые теплопотери'), value: fmt(norm.value, 1) + ' ' + norm.unit },
               { label: 'Теплопотери при принятой толщине', value: qAcc !== null ? fmt(qAcc, 1) + ' ' + unitQ(ctx.g) : '—' },
               { label: 'Температура поверхности при принятой толщине', value: r.atAccepted ? fmt(r.atAccepted.tSurf, 1) + ' °C' : '—' }];
    if (ch && r.atAccepted) r.extra.push({ label: 'Температура воздуха в канале', value: fmt(r.atAccepted.tAmbLocal, 1) + ' °C' });
    if (ch && r.atAccepted && r.atAccepted.D) {
      var Dacc = r.atAccepted.D;
      if (ch.b < Dacc + 0.3 || ch.h < Dacc + 0.15) ctx.warnings.push({ code: 'channel-size',
        text: 'Изолированная труба Ø' + fmt(Dacc * 1000, 0) + ' мм тесно размещается в канале ' + fmt(ch.b, 2) + '×' + fmt(ch.h, 2) + ' м. Рекомендуемые зазоры для монтажа: ширина ≥ ' + fmt(Dacc + 0.3, 2) + ' м, высота ≥ ' + fmt(Dacc + 0.15, 2) + ' м.' });
    }
    ctx.refs.push(mode === 'norm' ? 'СП 61.13330.2012, п. 6.1, приложение В.2.1' : 'СП 61.13330.2012, п. 6.2, приложение В.2.1');
    return r;
  }

  function objFields(i) {
    var o = i.object, f = ['object'];
    if (o === 'pipe') { f = f.concat(['pipeMaterial', 'od']); if (i.pipeMaterial === 'plastic') f.push('wallPlastic'); f.push('orientation'); }
    if (o === 'duct') { f.push('ductShape'); f = f.concat(i.ductShape === 'rect' ? ['ductA', 'ductB'] : ['ductD']); }
    if (o === 'tank') { f.push('tankShape', 'tankD'); if (i.tankShape !== 'sphere') f.push('tankH'); f.push('tankWall', 'tankFill'); }
    return f;
  }
  function matFields() { return ['materialId', 'lambdaModel', 'product', 'covering']; }

  core.CALCS = CALCS;
  core.getCalc = function (id) { return CALCS.filter(function (c) { return c.id === id; })[0]; };

  // Нормализованный объект для интерфейса: какие поля показывать сейчас
  core.visibleFields = function (calcId, inp) {
    var c = core.getCalc(calcId), obj = inp.object && c.objects.indexOf(inp.object) >= 0 ? inp.object : c.objects[0];
    var i2 = Object.assign({}, inp, { object: obj });
    var envs = c.envs(obj);
    i2.env = inp.env && envs.indexOf(inp.env) >= 0 ? inp.env : envs[0];
    return { fields: c.fields(i2), object: obj, env: i2.env, envs: envs, objects: c.objects };
  };

  // ---------------------------------------------------------------- точка входа
  core.calculate = function (calcId, input) {
    var calc = core.getCalc(calcId);
    if (!calc) return { ok: false, errors: [{ code: 'calc', text: 'Неизвестный тип расчёта' }] };
    var inp = Object.assign({}, input);
    try {
      var ctx = context(inp, calc);
      inp.object = ctx.obj; inp.env = ctx.env;
      var r = calc.compute(ctx);
      return { ok: true, calcId: calcId, calcTitle: calc.title, input: inp, result: r, material: ctx.mat.m, lambdaModel: ctx.mat.model,
        covering: ctx.mat.covering, geometry: ctx.g, steps: ctx.steps, coefficients: ctx.coefficients, warnings: ctx.warnings, refs: ctx.refs,
        explanation: r.explanation };
    } catch (e) {
      if (e instanceof core.CalcError) return { ok: false, calcId: calcId, input: inp, errors: [{ code: e.code, text: e.text, field: e.field }] };
      throw e;
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
