<script>/* src/ui/app.js */
/* UNIONFLEX CALCULATOR — интерфейс. Расчёты выполняет UF.core (без DOM). */
(function () {
  var core = UF.core, F = core.FIELDS, icon = UF.icon, fmt = core.fmt;
  // Веб-версия (страница по ссылке): печать и скачивание файлов средой запрещены
  var EMBED = !!window.UF_EMBED;
  var $main = document.getElementById('main');
  var $mbar = document.getElementById('mbar');

  // ---------------------------------------------------------------- хранилище (с защитой)
  var store = {
    get: function (k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  };
  var state = {
    engineer: store.get('uf.engineer', false),
    inputs: store.get('uf.inputs.v1', {}),
    objectName: store.get('uf.objectName', ''),
    last: null
  };
  function history() { return store.get('uf.history.v1', []); }
  function saveHistory(h) { return store.set('uf.history.v1', h); }

  // ---------------------------------------------------------------- утилиты
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function debounce(fn, ms) { var t; return function () { clearTimeout(t); t = setTimeout(fn, ms); }; }
  function today() { var d = new Date(); return d.toLocaleDateString('ru-RU'); }
  function mm(x) { return x === null || x === undefined ? '—' : (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : fmt(x, 1)); }

  // ---------------------------------------------------------------- маршрутизация
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/');
    if (document.body.classList.contains('show-report')) closeReport();
    window.scrollTo(0, 0);
    if (parts[0] === 'calc' && core.getCalc(parts[1])) renderCalc(parts[1]);
    else if (parts[0] === 'history') renderHistory();
    else renderHome();
  }
  window.addEventListener('hashchange', route);

  // ---------------------------------------------------------------- тема: дневная / ночная
  var $theme = document.getElementById('themeBtn');
  var darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : !!(darkMq && darkMq.matches);
  }
  var SUN = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function paintTheme() {
    var dark = isDark();
    $theme.innerHTML = (dark ? SUN : MOON) + '<span class="hide-sm">' + (dark ? 'Дневной' : 'Ночной') + '</span>';
    $theme.title = dark ? 'Включить дневной режим (светлый фон)' : 'Включить ночной режим (тёмный фон)';
    $theme.setAttribute('aria-label', $theme.title);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#171e27' : '#0b6e8a';
  }
  $theme.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('uf.theme', next); } catch (e) {}
    paintTheme();
  });
  if (darkMq && darkMq.addEventListener) darkMq.addEventListener('change', paintTheme);
  paintTheme();

  var $eng = document.getElementById('engToggle');
  $eng.checked = state.engineer;
  $eng.addEventListener('change', function () {
    state.engineer = $eng.checked; store.set('uf.engineer', state.engineer);
    if (currentCalc) { renderForm(); compute(); }
  });

  // ---------------------------------------------------------------- главная
  function renderHome() {
    currentCalc = null; $mbar.hidden = true;
    var recent = history().slice(0, 3);
    $main.innerHTML =
      '<section class="hero"><h1>Рассчитайте необходимую толщину теплоизоляции</h1>' +
      '<p>Выберите задачу — калькулятор подберёт толщину изоляции UNIONFLEX по СП 61.13330 и покажет готовое изделие.</p></section>' +
      '<div class="section-title">Что нужно сделать</div>' +
      '<div class="goals">' + core.CALCS.map(function (c) {
        return '<button class="goal" data-calc="' + c.id + '"><span class="goal-ic">' + icon(c.icon) + '</span><span><b>' + esc(c.title) + '</b><span>' + esc(c.short) + '</span></span></button>';
      }).join('') + '</div>' +
      (recent.length ? '<div class="section-title">Недавние расчёты</div><div class="recent">' + recent.map(histRow).join('') + '</div>' : '') +
      '<div class="note-box">' + icon('info') + ' Расчёт выполняется по методике СП 61.13330.2012 «Тепловая изоляция оборудования и трубопроводов» (с Изм. 1, 2). Характеристики материалов — по данным производителя UNIONFLEX и СП 61. Результат носит рекомендательный характер и не заменяет проект.</div>';
    $main.querySelectorAll('[data-calc]').forEach(function (b) { b.onclick = function () { location.hash = '#/calc/' + b.dataset.calc; }; });
    bindHistRows($main);
  }

  function histRow(h) {
    return '<div class="recent-item" data-open="' + h.id + '">' + icon(core.getCalc(h.calcId) ? core.getCalc(h.calcId).icon : 'file') +
      '<div class="meta"><b>' + esc(h.objectName || h.title) + '</b><div class="muted">' + esc(h.title) + ' · ' + esc(h.date) + '</div></div>' +
      '<div class="big">' + esc(h.summary) + '</div></div>';
  }
  function bindHistRows(scope) {
    scope.querySelectorAll('[data-open]').forEach(function (r) {
      r.onclick = function () { openFromHistory(r.dataset.open); };
    });
  }
  function openFromHistory(id) {
    var h = history().filter(function (x) { return x.id === id; })[0];
    if (!h) return;
    state.inputs[h.calcId] = Object.assign({}, h.input);
    state.objectName = h.objectName || '';
    store.set('uf.inputs.v1', state.inputs); store.set('uf.objectName', state.objectName);
    location.hash = '#/calc/' + h.calcId;
  }

  // ---------------------------------------------------------------- экран расчёта
  var currentCalc = null, lastResult = null;

  function renderCalc(id) {
    currentCalc = core.getCalc(id);
    if (!state.inputs[id]) state.inputs[id] = {};
    $main.innerHTML =
      '<div class="crumbs"><a class="btn ghost small" href="#/">' + icon('back') + 'Все задачи</a></div>' +
      '<div class="calc-head"><span class="goal-ic">' + icon(currentCalc.icon) + '</span><div><h1>' + esc(currentCalc.title) + '</h1><p>' + esc(currentCalc.short) + '</p></div></div>' +
      '<div class="calc-grid"><div id="formCol"></div><aside class="card result" id="resPanel" aria-live="polite"></aside></div>';
    renderForm();
    compute();
  }

  function inputs() { return state.inputs[currentCalc.id]; }

  function renderForm() {
    var inp = inputs();
    var vf = core.visibleFields(currentCalc.id, inp);
    inp.object = vf.object; inp.env = vf.env;
    var groups = { object: [], conditions: [], material: [] };
    vf.fields.forEach(function (f) {
      var d = F[f]; if (!d) return;
      if (d.engineer && !state.engineer) return;
      groups[d.group].push(f);
    });
    var col = document.getElementById('formCol');
    var scrollY = window.scrollY;
    col.innerHTML =
      stepCard(1, 'Объект', '<div class="field wide"><label for="f_objectName">Название объекта для отчёта <span class="muted">(необязательно)</span></label>' +
        '<div class="inp"><input id="f_objectName" type="text" maxlength="120" placeholder="Например: ИТП, корпус 2, трубопровод ХВС" value="' + esc(state.objectName) + '"></div></div>' +
        groups.object.map(function (f) { return fieldHtml(f, inp, vf); }).join('')) +
      stepCard(2, 'Условия', groups.conditions.map(function (f) { return fieldHtml(f, inp, vf); }).join('')) +
      stepCard(3, 'Материал', groups.material.map(function (f) { return fieldHtml(f, inp, vf); }).join('')) +
      '<div id="engCol"></div>';
    bindForm(col);
    window.scrollTo(0, scrollY);
  }

  function stepCard(n, title, body) {
    return '<section class="card step"><div class="step-h"><span class="step-n">' + n + '</span><h2>' + title + '</h2></div><div class="fields">' + body + '</div></section>';
  }

  function label(f, inp) {
    var c = currentCalc.id, env = inp.env;
    if (f === 'tIn') {
      if (c === 'tempChange') return 'Начальная температура вещества';
      if (c === 'freezing') return 'Начальная температура воды';
      if (c === 'ductInternal') return 'Температура воздуха внутри воздуховода';
      if (c === 'check' || c === 'givenFlux' || c === 'norm') return 'Температура вещества (теплоносителя)';
    }
    if (f === 'tAir') {
      if (env === 'channel') return 'Температура грунта на глубине оси';
      if (c === 'ductInternal') return 'Температура снаружи воздуховода';
    }
    if (f === 'tEnd') return 'Допустимая температура в конце участка';
    return F[f].label;
  }
  function helpFor(f, inp) {
    var c = currentCalc.id, env = inp.env;
    if (f === 'tAir') {
      if (env === 'room') return 'По умолчанию 20 °C (СП 61, п. 6.1.5, 6.3). Укажите, если в помещении иначе.';
      if (env === 'tunnel') return 'По умолчанию 40 °C (СП 61, п. 6.1.5).';
      if (env === 'channel') return 'Среднегодовая температура грунта на глубине оси трубы. Если перекрытие канала заглублено не более чем на 0,7 м — температура наружного воздуха (СП 61, п. 6.1.5 г).';
      if (c === 'norm' || c === 'givenFlux' || c === 'check') return 'Среднегодовая температура наружного воздуха по СП 131.13330 (п. 6.1.5 а).';
      if (c === 'network') return 'Круглый год — среднегодовая; только отопительный период — средняя температура периода со среднесуточной ≤ 8 °C (СП 131.13330, СП 61 п. 6.1.5).';
      if (c === 'freezing') return 'Температура наиболее холодной пятидневки обеспеченностью 0,92 по СП 131.13330 (СП 61, п. 6.3).';
      if (c === 'surface') return 'Средняя максимальная температура наиболее жаркого месяца по СП 131.13330 (СП 61, п. 6.7.2).';
      if (c === 'tempChange') return 'Для улицы — температура холодной пятидневки 0,92 (СП 61, п. 6.3, 6.4).';
    }
    if (f === 'tIn' && c === 'condensation') return 'Температура холодного вещества в трубе (ёмкости, воздуховоде).';
    return F[f].help;
  }
  function unitFor(f, inp) {
    if (f === 'qGiven') {
      var round = inp.object === 'pipe' || (inp.object === 'duct' && inp.ductShape !== 'rect' && !(+inp.ductD >= 2000));
      return round ? 'Вт/м' : 'Вт/м²';
    }
    if (f === 'flow') return { kgh: 'кг/ч', m3h: 'м³/ч', ms: 'м/с' }[inp.flowUnit || 'kgh'];
    return F[f].unit;
  }

  function fieldHtml(f, inp, vf) {
    var d = F[f], v = inp[f], id = 'f_' + f, help = helpFor(f, inp);
    var lbl = '<label for="' + id + '">' + esc(label(f, inp)) + (help ? ' <span class="help" tabindex="0" aria-label="Подсказка">?<span class="tip">' + esc(help) + '</span></span>' : '') + '</label>';
    var mat = currentMaterial(inp);
    if (f === 'object') return seg(f, 'Что изолируем', vf.objects.map(function (o) { return [o, core.OBJECT_LABELS[o]]; }), vf.object, true);
    if (f === 'env') return seg(f, 'Где находится', vf.envs.map(function (e) { return [e, core.ENV_LABELS[e]]; }), vf.env, true);
    if (f === 'materialId') {
      var cur = inp.materialId || d.default;
      return '<div class="field wide"><span class="lbl">Материал</span><div class="mats">' + UF.data.materials.map(function (m) {
        var lm = m.lambdaModels[m.defaultLambda];
        return '<button type="button" class="mat" data-f="materialId" data-v="' + m.id + '" aria-pressed="' + (m.id === cur) + '"><b>' + esc(m.name) + '</b><span>' + esc(m.short) + '</span>' +
          '<div class="props">' + esc(core.lambdaFormula(lm)) + ' · ' + m.tempRange[0] + '…+' + m.tempRange[1] + ' °C · ' + esc(m.fire.split(',')[0]) + '</div></button>';
      }).join('') + '</div></div>';
    }
    if (f === 'lambdaModel') {
      var keys = Object.keys(mat.lambdaModels);
      if (keys.length < 2) return '';
      var curM = inp.lambdaModel && mat.lambdaModels[inp.lambdaModel] ? inp.lambdaModel : mat.defaultLambda;
      return seg(f, 'Теплопроводность материала', keys.map(function (k) { return [k, mat.lambdaModels[k].label + ' — ' + core.lambdaFormula(mat.lambdaModels[k])]; }), curM, true);
    }
    if (f === 'product') {
      var opts = [['auto', 'Подобрать автоматически']];
      if (mat.products.tube && inp.object === 'pipe') opts.push(['tube', 'Трубка']);
      if (mat.products.roll) opts.push(['roll', 'Рулон']);
      var curP = opts.some(function (o) { return o[0] === inp.product; }) ? inp.product : 'auto';
      return seg(f, 'Вид изделия', opts, curP, false);
    }
    if (f === 'covering') {
      var list = coveringsFor(mat, inp);
      var curC = list.indexOf(inp.covering) >= 0 ? inp.covering : 'none';
      return '<div class="field wide">' + lbl + '<div class="inp"><select id="' + id + '" data-f="covering">' + list.map(function (c) {
        var cv = UF.data.coverings[c];
        return '<option value="' + c + '"' + (c === curC ? ' selected' : '') + '>' + esc(cv.label) + ' — ' + (cv.emissivity === 'low' ? 'металлическая поверхность' : 'неметаллическая поверхность') + '</option>';
      }).join('') + '</select></div></div>';
    }
    if (f === 'soil') {
      var curS = inp.soil || d.default;
      return '<div class="field wide">' + lbl + '<div class="inp"><select id="' + id + '" data-f="soil">' + UF.data.sp61.soils.map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === curS ? ' selected' : '') + '>' + esc(s.label) + ' — λ = ' + fmt(s.value, 2) + '</option>';
      }).join('') + '</select></div><span class="fhint">СП 61, табл. В.6</span></div>';
    }
    if (d.type === 'choice') {
      var o = d.options, curV = v || d.default;
      if (o.length <= 4) return seg(f, label(f, inp), o, curV, o.length > 2 && f === 'regime');
      return '<div class="field">' + lbl + '<div class="inp"><select id="' + id + '" data-f="' + f + '">' + o.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === curV ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') + '</select></div></div>';
    }
    // число
    var ph = '';
    if (f === 'tAir' && (inp.env === 'room' || inp.env === 'tunnel') && currentCalc.id !== 'ductInternal') ph = (inp.env === 'room' ? '20' : '40') + ' — по СП 61';
    else if (d.default !== undefined) ph = String(d.default).replace('.', ',') + ' — по умолчанию';
    else if (f === 'wallPlastic') ph = 'по SDR 41';
    var list2 = '';
    if (f === 'od') {
      var pm = inp.pipeMaterial || 'steel';
      list2 = '<datalist id="dl_od">' + UF.data.pipes.presets[pm].map(function (x) { return '<option value="' + String(x).replace('.', ',') + '">'; }).join('') + '</datalist>';
    }
    var extra = '';
    if (f === 'surfaceLimit') {
      var lim = UF.data.sp61.surfaceTempLimits.filter(function (x) { return x.env === (inp.env === 'outdoor' ? 'outdoor' : 'room'); });
      extra = '<div class="chips">' + lim.map(function (x) { return '<button type="button" class="chip" data-set="surfaceLimit" data-v="' + x.value + '">' + esc(x.label) + ': ' + x.value + ' °C</button>'; }).join('') + '</div>';
    }
    var unit = unitFor(f, inp);
    return '<div class="field' + (f === 'surfaceLimit' ? ' wide' : '') + '" data-field="' + f + '">' + lbl +
      '<div class="inp"><input id="' + id + '" data-f="' + f + '" inputmode="decimal" autocomplete="off"' + (f === 'od' ? ' list="dl_od"' : '') +
      ' value="' + esc(v === undefined || v === null ? '' : String(v).replace('.', ',')) + '" placeholder="' + esc(ph) + '">' +
      (unit ? '<span class="unit">' + esc(unit) + '</span>' : '') + '</div>' + list2 + extra + '<span class="ferr" hidden></span></div>';
  }

  function seg(f, title, options, cur, wide) {
    return '<div class="field' + (wide ? ' wide' : '') + '" data-field="' + f + '"><span class="lbl">' + esc(title) + '</span><div class="seg" role="group" aria-label="' + esc(title) + '">' +
      options.map(function (o) { return '<button type="button" data-f="' + f + '" data-v="' + o[0] + '" aria-pressed="' + (o[0] === cur) + '">' + esc(o[1]) + '</button>'; }).join('') + '</div></div>';
  }

  function currentMaterial(inp) {
    var id = inp.materialId || F.materialId.default;
    return UF.data.materials.filter(function (m) { return m.id === id; })[0] || UF.data.materials[0];
  }
  function coveringsFor(mat, inp) {
    var p = inp.product || 'auto', out = [];
    Object.keys(mat.products).forEach(function (k) {
      if (p !== 'auto' && k !== p) return;
      if (k === 'tube' && inp.object !== 'pipe') return;
      mat.products[k].coverings.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
    });
    if (!out.length) out = ['none'];
    return out;
  }

  var computeSoon = debounce(function () { compute(); }, 250);

  function bindForm(scope) {
    scope.querySelectorAll('button[data-f]').forEach(function (b) {
      b.onclick = function () { inputs()[b.dataset.f] = b.dataset.v; persist(); renderForm(); compute(); };
    });
    scope.querySelectorAll('select[data-f]').forEach(function (s) {
      s.onchange = function () { inputs()[s.dataset.f] = s.value; persist(); renderForm(); compute(); };
    });
    scope.querySelectorAll('input[data-f]').forEach(function (i) {
      i.oninput = function () {
        var raw = i.value.trim();
        if (raw === '') delete inputs()[i.dataset.f]; else inputs()[i.dataset.f] = raw;
        persist(); clearFieldError(i.dataset.f); computeSoon();
        if (i.dataset.f === 'ductD' || i.dataset.f === 'od') { /* единицы q могут поменяться */ }
      };
    });
    scope.querySelectorAll('[data-set]').forEach(function (b) {
      b.onclick = function () { inputs()[b.dataset.set] = b.dataset.v; persist(); renderForm(); compute(); };
    });
    var on = document.getElementById('f_objectName');
    if (on) on.oninput = function () { state.objectName = on.value; store.set('uf.objectName', state.objectName); };
  }
  function persist() { store.set('uf.inputs.v1', state.inputs); }

  function clearFieldError(f) {
    var w = document.querySelector('[data-field="' + f + '"]');
    if (w) { w.classList.remove('invalid'); var e = w.querySelector('.ferr'); if (e) e.hidden = true; }
  }
  function markFieldError(f, text) {
    var w = document.querySelector('[data-field="' + f + '"]');
    if (!w) return false;
    w.classList.add('invalid');
    var e = w.querySelector('.ferr'); if (e) { e.textContent = text; e.hidden = false; }
    return true;
  }

  // Незаполненные обязательные поля (чтобы не показывать ошибку, пока пользователь не ввёл данные)
  function missing() {
    var inp = inputs(), vf = core.visibleFields(currentCalc.id, inp), out = [];
    vf.fields.forEach(function (f) {
      var d = F[f];
      if (!d || d.type !== 'number' || d.optional || d.default !== undefined) return;
      if (d.engineer && !state.engineer) return;
      if (f === 'tAir' && (vf.env === 'room' || vf.env === 'tunnel') && currentCalc.id !== 'ductInternal') return;
      var v = inp[f];
      if (v === undefined || v === null || String(v).trim() === '') out.push(label(f, Object.assign({}, inp, { env: vf.env })));
    });
    return out;
  }

  // ---------------------------------------------------------------- расчёт и результат
  function compute() {
    if (!currentCalc) return;
    document.querySelectorAll('.field.invalid').forEach(function (w) { w.classList.remove('invalid'); var e = w.querySelector('.ferr'); if (e) e.hidden = true; });
    var panel = document.getElementById('resPanel');
    var miss = missing();
    if (miss.length) { lastResult = null; panel.innerHTML = emptyPanel(miss); renderEng(null); updateMbar(null); return; }
    var res;
    try { res = core.calculate(currentCalc.id, inputs()); }
    catch (e) { res = { ok: false, errors: [{ text: 'Внутренняя ошибка расчёта: ' + e.message }] }; console.error(e); }
    lastResult = res;
    if (!res.ok) {
      res.errors.forEach(function (er) { if (er.field) markFieldError(er.field, er.text); });
      panel.innerHTML = '<div class="res-label">Результат</div>' + res.errors.map(function (er) { return msg('err', er.text); }).join('');
      renderEng(null); updateMbar(null);
      return;
    }
    panel.innerHTML = resultHtml(res);
    bindResult(panel, res);
    renderEng(res);
    updateMbar(res);
  }

  function msg(kind, text) { return '<div class="msg ' + kind + '">' + icon(kind === 'err' ? 'x' : kind === 'warn' ? 'alert' : kind === 'ok' ? 'check' : 'info') + '<span>' + esc(text) + '</span></div>'; }

  function emptyPanel(miss) {
    return '<div class="res-label">Результат</div><div class="res-big" style="color:var(--text-3)">— <small>мм</small></div>' +
      '<div class="empty-res">Заполните данные, и толщина рассчитается автоматически:<ul>' + miss.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div>';
  }

  function mainBlock(r, res, compact) {
    if (r.notNeeded) {
      var s = '<div class="res-label">' + (r.label ? esc(r.label) : 'Рекомендуемая толщина') + '</div><div class="res-big">0 <small>мм</small></div>' +
        '<div class="res-product">Изоляция по этому условию не требуется</div>';
      if (r.selection && r.selection.suggestion) s += '<div class="res-sub">Для защиты поверхности можно применить: ' + esc(r.selection.suggestion.text) + '</div>';
      return s;
    }
    var sel = r.selection;
    return '<div class="res-label">' + (r.label ? esc(r.label) : 'Рекомендуемая толщина') + '</div>' +
      '<div class="res-big">' + mm(r.thicknessAccepted_mm) + ' <small>мм</small></div>' +
      '<div class="res-product">' + esc(sel.product.code) + '</div>' +
      (compact ? '' : '<div class="res-sub">' + esc(res.material.name) + ', ' + esc(res.covering.label.split(' — ')[0].toLowerCase()) + '</div>') +
      '<dl class="kv"><dt>Расчётная толщина</dt><dd>' + fmt(r.thicknessCalc_mm, 1) + ' мм</dd><dt>Принятая стандартная толщина</dt><dd>' + mm(r.thicknessAccepted_mm) + ' мм</dd>' +
      (sel.product.layers.length > 1 ? '<dt>Слои</dt><dd>' + sel.product.layers.join(' + ') + ' мм</dd>' : '') + '</dl>';
  }

  function resultHtml(res) {
    var r = res.result, h = '';
    if (r.checkOnly) {
      h += '<div class="res-label">Теплопотери</div><div class="res-big">' + fmt(Math.abs(r.atGiven.q), 1) + ' <small>' + (res.geometry.geom === 'cyl' ? 'Вт/м' : 'Вт/м²') + '</small></div>' +
        '<div class="res-product">Поверхность изоляции: ' + fmt(r.atGiven.tSurf, 1) + ' °C</div><div class="res-sub">' + esc(res.material.name) + ', ' + mm(r.thicknessGiven_mm) + ' мм</div>';
      h += '<dl class="kv">' + r.extra.map(function (x) { return '<dt>' + esc(x.label) + '</dt><dd>' + esc(x.value) + '</dd>'; }).join('') + '</dl>';
      h += r.verdicts.map(function (v) { return msg(v.ok ? 'ok' : 'warn', v.text); }).join('');
    } else if (r.parts) {
      h += '<div class="parts">' + r.parts.map(function (p) { return '<div class="part">' + mainBlock(p, res, true) + '</div>'; }).join('') + '</div>';
      h += '<div class="res-sub" style="margin-top:8px">' + esc(res.material.name) + '</div>';
    } else {
      h += mainBlock(r, res);
      if (r.extra) h += '<dl class="kv" style="margin-top:0;border-top:0">' + r.extra.map(function (x) { return '<dt>' + esc(x.label) + '</dt><dd>' + esc(x.value) + '</dd>'; }).join('') + '</dl>';
    }
    h += '<div class="explain">' + esc(res.explanation) + '</div>';
    var sel = r.parts ? r.parts[0].selection : r.selection;
    var allSel = r.parts ? r.parts.map(function (p) { return p.selection; }) : [r.selection];
    allSel.forEach(function (s) { if (!s) return; (s.alternatives || []).forEach(function (a) { h += msg('info', a.text); }); (s.notes || []).forEach(function (n) { h += msg('info', n); }); });
    res.warnings.forEach(function (w) { h += msg('warn', w.text); });
    if (res.lambdaModel && res.lambdaModel.type === 'constant') h += msg('info', 'Теплопроводность ' + res.material.name + ' принята постоянной (' + fmt(res.lambdaModel.value, 3) + ' Вт/(м·°C)) — зависимость от температуры производителем не опубликована.');
    h += '<div class="actions"><button class="btn primary" id="btnPdf">' + icon('file') + (EMBED ? 'Показать отчёт' : 'Сформировать PDF') + '</button>' +
      '<button class="btn" id="btnSave">' + icon('save') + 'Сохранить</button><a class="btn" href="#/history">' + icon('history') + 'История</a></div>';
    return h;
  }

  function bindResult(panel, res) {
    panel.querySelector('#btnPdf').onclick = function () { printReport(res); };
    panel.querySelector('#btnSave').onclick = function (e) {
      var ok = saveToHistory(res);
      e.currentTarget.innerHTML = icon(ok ? 'check' : 'x') + (ok ? 'Сохранено' : 'Не удалось сохранить');
    };
  }

  function summaryOf(res) {
    var r = res.result;
    if (r.checkOnly) return fmt(Math.abs(r.atGiven.q), 1) + (res.geometry.geom === 'cyl' ? ' Вт/м' : ' Вт/м²');
    if (r.parts) return r.parts.map(function (p) { return mm(p.thicknessAccepted_mm); }).join(' / ') + ' мм';
    return mm(r.thicknessAccepted_mm) + ' мм';
  }

  function updateMbar(res) {
    $mbar.hidden = !currentCalc;
    if (!currentCalc) return;
    $mbar.innerHTML = '<div><div class="l">' + (res ? (res.result.checkOnly ? 'Теплопотери' : 'Рекомендуемая толщина') : 'Результат') + '</div><div class="v">' + (res ? esc(summaryOf(res)) : '—') + '</div></div>' +
      '<button class="btn primary small" id="mbarGo">Подробнее</button>';
    document.getElementById('mbarGo').onclick = function () { document.getElementById('resPanel').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  }

  // ---------------------------------------------------------------- инженерный режим
  function inputRows(res) {
    var inp = res.input, vf = core.visibleFields(res.calcId, inp), rows = [];
    rows.push(['Тип расчёта', res.calcTitle]);
    vf.fields.forEach(function (f) {
      var d = F[f]; if (!d) return;
      var v = inp[f], shown;
      if (f === 'object') shown = core.OBJECT_LABELS[inp.object];
      else if (f === 'env') shown = core.ENV_LABELS[inp.env];
      else if (f === 'materialId') shown = res.material.name;
      else if (f === 'lambdaModel') shown = res.lambdaModel.label;
      else if (f === 'covering') shown = res.covering.label;
      else if (f === 'soil') { var s = UF.data.sp61.soils.filter(function (x) { return x.id === (v || d.default); })[0]; shown = s ? s.label + ' (λ = ' + fmt(s.value, 2) + ')' : ''; }
      else if (d.type === 'choice') { var o = (d.options || []).filter(function (x) { return x[0] === (v || d.default); })[0]; shown = o ? o[1] : (v || ''); }
      else if (v === undefined || v === '') {
        if (f === 'tAir' && inp.env === 'room') shown = '20 °C (по умолчанию, СП 61)';
        else if (f === 'tAir' && inp.env === 'tunnel') shown = '40 °C (по умолчанию, СП 61)';
        else if (d.default !== undefined) shown = String(d.default).replace('.', ',') + ' ' + (unitFor(f, inp) || '') + ' (по умолчанию)';
        else shown = '—';
      } else shown = String(v).replace('.', ',') + ' ' + (unitFor(f, inp) || '');
      rows.push([label(f, inp), shown]);
    });
    return rows;
  }

  function engHtml(res, forReport) {
    var h = '<h3>Исходные данные</h3><table class="tbl"><tbody>' + inputRows(res).map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td class="num">' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>';
    h += '<h3>Коэффициенты и характеристики</h3><table class="tbl"><thead><tr><th>Величина</th><th>Значение</th><th>Источник</th></tr></thead><tbody>' +
      res.coefficients.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td class="num">' + esc(c.value) + ' ' + esc(c.unit) + '</td><td class="src">' + esc(c.source) + '</td></tr>'; }).join('') + '</tbody></table>';
    h += '<h3>Ход расчёта</h3><ol class="steps">' + res.steps.map(function (s) {
      return '<li><b>' + esc(s.title) + '</b>' + (s.formula ? '<code class="formula">' + esc(s.formula) + '</code>' : '') +
        (s.values ? '<div>' + esc(s.values) + '</div>' : '') + (s.result ? '<div><b>' + esc(s.result) + '</b></div>' : '') + (s.ref ? '<div class="src">' + esc(s.ref) + '</div>' : '') + '</li>';
    }).join('') + '</ol>';
    var r = res.result;
    var parts = r.parts || (r.checkOnly ? [] : [r]);
    if (parts.length) {
      h += '<h3>Промежуточные результаты</h3><table class="tbl"><thead><tr><th></th><th>При расчётной толщине</th><th>При принятой толщине</th></tr></thead><tbody>';
      parts.forEach(function (p) {
        var a = p.atCalc, b = p.atAccepted, u = res.geometry.geom === 'cyl' ? 'Вт/м' : 'Вт/м²';
        if (p.label) h += '<tr><td colspan="3"><b>' + esc(p.label) + '</b></td></tr>';
        h += '<tr><td>Толщина, мм</td><td class="num">' + fmt(p.thicknessCalc_mm, 2) + '</td><td class="num">' + mm(p.thicknessAccepted_mm) + '</td></tr>';
        h += '<tr><td>Теплопотери, ' + u + '</td><td class="num">' + (a ? fmt(Math.abs(a.q), 2) : '—') + '</td><td class="num">' + (b ? fmt(Math.abs(b.q), 2) : '—') + '</td></tr>';
        h += '<tr><td>Температура поверхности, °C</td><td class="num">' + (a ? fmt(a.tSurf, 2) : '—') + '</td><td class="num">' + (b ? fmt(b.tSurf, 2) : '—') + '</td></tr>';
        h += '<tr><td>λ при t_ср, Вт/(м·°C)</td><td class="num">' + (a ? fmt(a.lambda, 4) + ' (' + fmt(a.tm, 1) + ' °C)' : '—') + '</td><td class="num">' + (b ? fmt(b.lambda, 4) + ' (' + fmt(b.tm, 1) + ' °C)' : '—') + '</td></tr>';
        h += '<tr><td>R изоляции / R поверхности</td><td class="num">' + (a ? fmt(a.Riz, 4) + ' / ' + fmt(a.Rn, 4) : '—') + '</td><td class="num">' + (b ? fmt(b.Riz, 4) + ' / ' + fmt(b.Rn, 4) : '—') + '</td></tr>';
      });
      h += '</tbody></table>';
      var sel = parts[0].selection;
      if (sel && sel.rule) h += '<p class="src">Правило выбора: ' + esc(sel.rule) + '. Альтернатива «на 3 мм меньше» допускается только при расчёте по нормам и по температуре поверхности.</p>';
    }
    h += '<h3>Нормативное основание</h3><ul>' + res.refs.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
      '<li>Методика расчёта: СП 61.13330.2012, приложение В (описание — в документации программы, CALCULATION_METHOD.md)</li></ul>';
    return h;
  }

  function renderEng(res) {
    var c = document.getElementById('engCol');
    if (!c) return;
    if (!state.engineer || !res || !res.ok) { c.innerHTML = state.engineer && !res ? '' : ''; return; }
    c.innerHTML = '<section class="card eng"><div class="step-h"><span class="step-n">' + icon('adjustments') + '</span><h2>Инженерный расчёт</h2></div>' + engHtml(res) + '</section>';
  }

  // ---------------------------------------------------------------- PDF (печать)
  function closeReport() {
    document.body.classList.remove('show-report');
    var r = document.getElementById('report'); r.innerHTML = ''; r.setAttribute('aria-hidden', 'true');
  }
  function printReport(res) {
    var r = res.result, title = state.objectName || 'Объект не указан';
    var mat = res.material, lm = res.lambdaModel;
    var mainRes;
    if (r.checkOnly) mainRes = '<div><div>Теплопотери</div><div class="v">' + fmt(Math.abs(r.atGiven.q), 1) + ' ' + (res.geometry.geom === 'cyl' ? 'Вт/м' : 'Вт/м²') + '</div></div><div>Толщина изоляции: <b>' + mm(r.thicknessGiven_mm) + ' мм</b><br>Температура поверхности: <b>' + fmt(r.atGiven.tSurf, 1) + ' °C</b></div>';
    else {
      var ps = r.parts || [r];
      mainRes = ps.map(function (p) {
        return '<div>' + (p.label ? '<div>' + esc(p.label) + '</div>' : '<div>Рекомендуемая толщина</div>') + '<div class="v">' + mm(p.thicknessAccepted_mm) + ' мм</div>' +
          '<div>Расчётная: <b>' + fmt(p.thicknessCalc_mm, 1) + ' мм</b><br>Принятая: <b>' + mm(p.thicknessAccepted_mm) + ' мм</b><br>' + (p.notNeeded ? 'Изоляция не требуется' : esc(p.selection.product.code)) + '</div></div>';
      }).join('');
    }
    var html = '<div class="rep">' +
      '<div class="rep-head"><div><h1>UNIONFLEX — РАСЧЁТ ТЕПЛОИЗОЛЯЦИИ</h1><div>' + esc(res.calcTitle) + '</div></div><div class="rep-date">Дата: ' + today() + '<br>UNIONFLEX CALCULATOR</div></div>' +
      '<h2>Объект</h2><table><tr><th style="width:30%">Объект</th><td>' + esc(title) + '</td></tr><tr><th>Изолируемый элемент</th><td>' + esc(core.OBJECT_LABELS[res.input.object]) + ', ' + esc(res.geometry.label) + ', ' + esc(core.ENV_LABELS[res.input.env]) + '</td></tr></table>' +
      '<h2>Итог</h2><div class="rep-result">' + mainRes + '</div><p>' + esc(res.explanation) + '</p>' +
      (res.warnings.length ? '<p><b>Предупреждения:</b> ' + res.warnings.map(function (w) { return esc(w.text); }).join(' ') + '</p>' : '') +
      '<h2>Материал</h2><table><tr><th style="width:30%">Материал</th><td>' + esc(mat.name) + ' — ' + esc(mat.short) + '</td></tr>' +
      '<tr><th>Покрытие</th><td>' + esc(res.covering.label) + ' (' + (res.covering.emissivity === 'low' ? 'металлическая поверхность' : 'неметаллическая поверхность') + ')</td></tr>' +
      '<tr><th>Теплопроводность</th><td>' + esc(core.lambdaFormula(lm)) + ', Вт/(м·°C) — ' + esc(lm.source) + '</td></tr>' +
      '<tr><th>Температура применения</th><td>' + mat.tempRange[0] + '…+' + mat.tempRange[1] + ' °C. ' + esc(mat.tempNotes || '') + '</td></tr>' +
      '<tr><th>Плотность</th><td>' + esc(mat.density) + '</td></tr><tr><th>Сопротивление диффузии пара μ</th><td>' + esc(mat.mu) + '</td></tr>' +
      '<tr><th>Пожарно-технические характеристики</th><td>' + esc(mat.fire) + '</td></tr></table>' +
      '<h2>Расчёт</h2>' + engHtml(res, true).replace(/<h3>/g, '<h3 style="font-size:10.5pt;margin:10px 0 4px">') +
      '<h2>Нормативная методика</h2><p>Расчёт выполнен по СП 61.13330.2012 «Тепловая изоляция оборудования и трубопроводов» (актуализированная редакция СНиП 41-03-2003, с Изменениями N 1, 2), приложение В. Принятая толщина — по п. 6.12. Характеристики материалов — по данным производителя UNIONFLEX и СП 61.13330.</p>' +
      '<div class="foot">Документ сформирован программой UNIONFLEX CALCULATOR ' + today() + '. Результат носит рекомендательный характер и должен быть проверен проектировщиком.</div></div>';
    var $rep = document.getElementById('report');
    if (EMBED) {
      // Веб-версия: печать запрещена средой — показываем отчёт на экране
      $rep.innerHTML = '<div class="rep-bar"><button class="btn" id="repBack">' + icon('back') + 'К расчёту</button>' +
        '<span class="muted">Сохранить отчёт в PDF можно в файловой версии программы (UNIONFLEX_CALCULATOR.html). Здесь — просмотр.</span></div>' + html;
      $rep.setAttribute('aria-hidden', 'false');
      document.body.classList.add('show-report'); window.scrollTo(0, 0);
      document.getElementById('repBack').onclick = closeReport;
      return;
    }
    $rep.innerHTML = html;
    var old = document.title;
    document.title = ('UNIONFLEX_расчёт_' + (state.objectName || res.calcTitle) + '_' + new Date().toISOString().slice(0, 10)).replace(/[\\/:*?"<>|]/g, '_');
    setTimeout(function () { window.print(); setTimeout(function () { document.title = old; }, 500); }, 50);
  }

  // ---------------------------------------------------------------- история
  function saveToHistory(res) {
    var h = history();
    h.unshift({ id: String(Date.now()), date: new Date().toLocaleString('ru-RU'), calcId: res.calcId, title: res.calcTitle,
      objectName: state.objectName, input: Object.assign({}, inputs()), summary: summaryOf(res) });
    return saveHistory(h.slice(0, 200));
  }

  function renderHistory() {
    currentCalc = null; $mbar.hidden = true;
    var h = history();
    $main.innerHTML = '<div class="crumbs"><a class="btn ghost small" href="#/">' + icon('back') + 'Все задачи</a></div>' +
      '<div class="calc-head"><span class="goal-ic">' + icon('history') + '</span><div><h1>Сохранённые расчёты</h1><p>Хранятся в этом браузере. Для переноса на другое устройство используйте экспорт.</p></div></div>' +
      '<div class="hist-tools">' + (EMBED ? '' : '<button class="btn" id="hExport">' + icon('download') + 'Экспорт в файл</button>') +
      '<label class="btn" for="hImport">' + icon('upload') + 'Импорт из файла</label><input type="file" id="hImport" accept=".json,application/json" hidden></div>' +
      '<div id="hMsg"></div>' +
      (h.length ? '<div class="hist-list">' + h.map(function (x) {
        return '<div class="hist-item">' + icon(core.getCalc(x.calcId) ? core.getCalc(x.calcId).icon : 'file') + '<div class="meta"><b>' + esc(x.objectName || 'Без названия') + '</b><div class="muted">' + esc(x.title) + ' · ' + esc(x.date) + '</div></div>' +
          '<div class="big">' + esc(x.summary) + '</div><div class="ops"><button class="btn small" data-open="' + x.id + '">Открыть</button><button class="btn small ghost" data-del="' + x.id + '" aria-label="Удалить">' + icon('trash') + '</button></div></div>';
      }).join('') + '</div>' : '<div class="note-box">Пока нет сохранённых расчётов. Нажмите «Сохранить» на экране результата.</div>');
    bindHistRows($main);
    // Удаление в два нажатия: первое спрашивает, второе удаляет (системные окна подтверждения есть не везде)
    $main.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.armed !== '1') {
          b.dataset.armed = '1'; b.classList.add('danger'); b.innerHTML = icon('trash') + 'Удалить?';
          setTimeout(function () { if (b.isConnected && b.dataset.armed === '1') { b.dataset.armed = ''; b.classList.remove('danger'); b.innerHTML = icon('trash'); } }, 4000);
          return;
        }
        saveHistory(history().filter(function (x) { return x.id !== b.dataset.del; })); renderHistory();
      };
    });
    if (!EMBED) document.getElementById('hExport').onclick = function () {
      var data = { app: 'UNIONFLEX CALCULATOR', version: 1, exported: new Date().toISOString(), items: history() };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'unionflex_расчёты_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
    document.getElementById('hImport').onchange = function (e) {
      var file = e.target.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        var m = document.getElementById('hMsg');
        try {
          var data = JSON.parse(rd.result);
          if (!data || data.app !== 'UNIONFLEX CALCULATOR' || !Array.isArray(data.items)) throw new Error('bad');
          var cur = history(), ids = cur.map(function (x) { return x.id; });
          var add = data.items.filter(function (x) { return x && x.id && x.calcId && core.getCalc(x.calcId) && ids.indexOf(x.id) < 0; });
          saveHistory(add.concat(cur).slice(0, 500));
          renderHistory();
          document.getElementById('hMsg').innerHTML = msg('ok', 'Импортировано расчётов: ' + add.length);
        } catch (er) { m.innerHTML = msg('err', 'Файл не распознан. Выберите файл, сохранённый кнопкой «Экспорт в файл».'); }
      };
      rd.readAsText(file);
    };
  }

  window.addEventListener('resize', debounce(function () { if (currentCalc) updateMbar(lastResult && lastResult.ok ? lastResult : null); }, 200));
  route();
})();

</script>
</body>
</html>
